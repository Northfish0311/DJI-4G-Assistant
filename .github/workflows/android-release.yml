name: Publish verified Android test APK

# Publishes the APK that a successful "Build Android remote companion" run produced for
# the current main commit. The previous version pinned one run id and one SHA, so it went
# stale the first time the app version changed.

on:
  # Pushing an android-remote-v* tag publishes without anyone opening the Actions page.
  push:
    tags:
      - "android-remote-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        type: string
        default: android-remote-v0.2.0
      title:
        description: Release title
        type: string
        default: 安卓远程助手 0.2.0（测试版）
      notes:
        description: Notes file, relative to the repository root
        type: string
        default: docs/RELEASE-android-remote-v0.2.0.md

permissions:
  contents: read

concurrency:
  group: android-remote-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-remote-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Require a successful build of this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?branch=main&status=success&per_page=1" \
            > "$RUNNER_TEMP/runs.json"
          run_id=$(jq -r '.workflow_runs[0].id // empty' "$RUNNER_TEMP/runs.json")
          run_sha=$(jq -r '.workflow_runs[0].head_sha // empty' "$RUNNER_TEMP/runs.json")
          test -n "$run_id" || { echo "No successful Android build found."; exit 1; }
          test "$run_sha" = "$GITHUB_SHA" || {
            echo "Newest Android build is $run_sha, not $GITHUB_SHA. Build this commit first."
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: DJI-4G-Remote-Android-test
          run-id: ${{ env.run_id }}
          github-token: ${{ github.token }}
          path: verified-android

      - name: Verify the artifact before publishing
        run: |
          set -euo pipefail
          cd verified-android/download
          sha256sum --check SHA256SUMS.txt
          apk=$(ls DJI-4G-Remote-Android-*-test.apk | head -n 1)
          test -s "$apk"
          echo "apk=$apk" >> "$GITHUB_ENV"
          test -s ../screenshots/phone.png
          test -s ../screenshots/tablet-layout.png

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          # A tag push supplies the tag name; manual runs use the inputs.
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          TITLE: ${{ inputs.title || '安卓远程助手测试版' }}
          NOTES: ${{ inputs.notes || 'docs/RELEASE-android-remote-v0.2.0.md' }}
        run: |
          set -euo pipefail
          cd verified-android/download
          assets=("$apk" SHA256SUMS.txt ../screenshots/phone.png ../screenshots/tablet-layout.png)
          # Re-running must not duplicate assets: upload with --clobber after creating.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file "../../$NOTES" --prerelease
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "$TITLE" --notes-file "../../$NOTES" \
              "${assets[@]}"
          fi
