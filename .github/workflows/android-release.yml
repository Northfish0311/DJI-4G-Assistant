name: Publish verified Android test APK

# Publishes the APK for whatever the Android build just produced:
#   - automatically when "Build Android remote companion" finishes green on main
#   - manually from the Actions page
#   - by pushing an android-remote-v* tag
# The release tag follows the APK versionName, so a version bump starts a new release and
# a rebuild of the same version refreshes the existing one instead of piling up assets.

on:
  workflow_run:
    workflows: ["Build Android remote companion"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "android-remote-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (defaults to android-remote-v<versionName>)
        type: string
      title:
        description: Release title (defaults to 安卓远程助手 <version>（测试版）)
        type: string
      notes:
        description: Notes file, relative to the repository root (defaults to docs/RELEASE-android-remote-v<version>.md)
        type: string

permissions:
  contents: read

concurrency:
  group: android-remote-release
  cancel-in-progress: false

jobs:
  publish:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/android-remote-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the build to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
            run_sha="${{ github.event.workflow_run.head_sha }}"
          else
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?branch=main&status=success&per_page=1" \
              > "$RUNNER_TEMP/runs.json"
            run_id=$(jq -r '.workflow_runs[0].id // empty' "$RUNNER_TEMP/runs.json")
            run_sha=$(jq -r '.workflow_runs[0].head_sha // empty' "$RUNNER_TEMP/runs.json")
            test -n "$run_id" || { echo "No successful Android build found."; exit 1; }
            # A tag on an old commit must not publish someone else's build.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              test "$run_sha" = "$GITHUB_SHA" || {
                echo "Newest Android build is $run_sha, not $GITHUB_SHA. Build this commit first."
                exit 1
              }
            fi
          fi
          version=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" android/app/build.gradle | head -n 1)
          test -n "$version" || { echo "Cannot read versionName from android/app/build.gradle."; exit 1; }
          {
            echo "run_id=$run_id"
            echo "run_sha=$run_sha"
            echo "version=$version"
          } >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: DJI-4G-Remote-Android-test
          run-id: ${{ env.run_id }}
          github-token: ${{ github.token }}
          path: verified-android

      - name: Verify the artifact before publishing
        run: |
          set -euo pipefail
          cd verified-android/download
          sha256sum --check SHA256SUMS.txt
          apk=$(ls DJI-4G-Remote-Android-*-test.apk | head -n 1)
          test -s "$apk"
          echo "apk=$apk" >> "$GITHUB_ENV"
          test -s ../screenshots/phone.png
          test -s ../screenshots/tablet-layout.png

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then tag="${{ github.ref_name }}"; else tag="android-remote-v$version"; fi
          fi
          title="${INPUT_TITLE:-安卓远程助手 $version（测试版）}"
          notes="${INPUT_NOTES:-docs/RELEASE-android-remote-v$version.md}"
          test -f "$notes" || { echo "Missing release notes: $notes"; exit 1; }
          cd verified-android/download
          assets=("$apk" SHA256SUMS.txt ../screenshots/phone.png ../screenshots/tablet-layout.png)
          # Re-running must not duplicate assets: upload with --clobber after creating.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file "../../$notes" --prerelease
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$run_sha" \
              --prerelease --latest=false --title "$title" --notes-file "../../$notes" \
              "${assets[@]}"
          fi
          echo "Published $tag from run $run_id ($run_sha)."
