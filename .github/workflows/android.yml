name: Build Android remote companion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and assemble test APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration on the disposable runner
        run: |
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Verify Android recovery and layouts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The app still compiles and targets API 35. API 34 is used here
          # because GitHub's software-rendered API 35 image intermittently
          # loses its color buffer before UiAutomator can inspect the screen.
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          emulator-boot-timeout: 300
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put system screen_off_timeout 2147483647
            adb shell settings put global stay_on_while_plugged_in 7
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p android/screenshots
            python3 android/scripts/check_pairing_ui.py
            gradle -p android --no-daemon connectedDebugAndroidTest
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 1600x2560
            adb shell wm density 240
            python3 android/scripts/check_pairing_ui.py --tablet
      - name: Package test download
        run: |
          mkdir -p android/download
          cp android/app/build/outputs/apk/debug/app-debug.apk android/download/DJI-4G-Remote-Android-0.1.0-test.apk
          cp docs/Android使用说明.md android/download/README-zh.md
          printf 'Commit: %s\nBuild: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > android/download/BUILD-SOURCE.txt
          cd android/download
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DJI-4G-Remote-Android-test
          path: |
            android/download/
            android/screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-instrumentation-results
          path: android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Android-UI-failure-screenshots
          path: android/screenshots/
          if-no-files-found: ignore
