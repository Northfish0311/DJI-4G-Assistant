name: Build Android remote companion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and assemble test APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Capture phone layout
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.northfish0311.dji4gremote/.MainActivity
            sleep 4
            mkdir -p android/screenshots
            adb shell pidof com.northfish0311.dji4gremote
            adb exec-out screencap -p > android/screenshots/phone.png
            python3 android/scripts/check_pairing_ui.py
            adb shell wm size 1600x2560
            adb shell wm density 240
            adb shell am force-stop com.northfish0311.dji4gremote
            adb shell am start -W -n com.northfish0311.dji4gremote/.MainActivity
            sleep 4
            adb shell pidof com.northfish0311.dji4gremote
            adb exec-out screencap -p > android/screenshots/tablet-layout.png
      - name: Package test download
        run: |
          mkdir -p android/download
          cp android/app/build/outputs/apk/debug/app-debug.apk android/download/DJI-4G-Remote-Android-0.1.0-test.apk
          cp docs/Android使用说明.md android/download/README-zh.md
          printf 'Commit: %s\nBuild: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > android/download/BUILD-SOURCE.txt
          cd android/download
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DJI-4G-Remote-Android-test
          path: |
            android/download/
            android/screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Android-UI-failure-screenshots
          path: android/screenshots/
          if-no-files-found: ignore
