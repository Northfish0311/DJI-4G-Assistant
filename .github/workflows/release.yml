name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install official lpac release
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\install-lpac.ps1
      - run: npm test
      - run: npm run build
      - name: Create SHA256 checksums
        shell: powershell
        run: |
          Get-ChildItem dist\DJI-4G-Assistant-*.exe |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DJI-4G-Assistant-Windows
          path: |
            dist/DJI-4G-Assistant-*.exe
            dist/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/DJI-4G-Assistant-*.exe
            dist/SHA256SUMS.txt
